<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">ContentLoop 完整创作流程</title>
  <desc id="desc">从灵感、网页或截图输入，经过 AI 理解、选题研究、七页创作，最终输出图片、压缩包与发布文案。人工确认贯穿全流程。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120c24"/>
      <stop offset="0.55" stop-color="#201338"/>
      <stop offset="1" stop-color="#38204a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1b46"/>
      <stop offset="1" stop-color="#211536"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3bd4a"/>
      <stop offset="1" stop-color="#ffdc78"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#090512" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L10 6 L1 11 Z" fill="#d5a94d"/>
    </marker>
  </defs>

  <rect width="1600" height="560" rx="34" fill="url(#background)"/>
  <rect x="1.5" y="1.5" width="1597" height="557" rx="32.5" fill="none" stroke="#6b4d80" stroke-width="3"/>

  <text x="68" y="72" fill="#ffda6a" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="700" letter-spacing="2">CONTENTLOOP WORKFLOW</text>
  <text x="68" y="125" fill="#fffaf0" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="40" font-weight="800">从一条线索，到一套可发布的七页内容</text>
  <text x="68" y="166" fill="#c7b9d8" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="23">每一步都有明确输入、结构化产物和人工确认点</text>

  <g filter="url(#shadow)">
    <rect x="68" y="215" width="255" height="205" rx="24" fill="url(#card)" stroke="#5d456f" stroke-width="2"/>
    <rect x="363" y="215" width="255" height="205" rx="24" fill="url(#card)" stroke="#5d456f" stroke-width="2"/>
    <rect x="658" y="215" width="255" height="205" rx="24" fill="url(#card)" stroke="#5d456f" stroke-width="2"/>
    <rect x="953" y="215" width="255" height="205" rx="24" fill="url(#card)" stroke="#5d456f" stroke-width="2"/>
    <rect x="1248" y="215" width="284" height="205" rx="24" fill="url(#card)" stroke="#d0a447" stroke-width="2.5"/>
  </g>

  <g fill="#1a102d" stroke="#d1a84e" stroke-width="2.5">
    <circle cx="110" cy="260" r="24"/>
    <circle cx="405" cy="260" r="24"/>
    <circle cx="700" cy="260" r="24"/>
    <circle cx="995" cy="260" r="24"/>
    <circle cx="1290" cy="260" r="24"/>
  </g>
  <g fill="#ffda6a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" text-anchor="middle">
    <text x="110" y="268">01</text>
    <text x="405" y="268">02</text>
    <text x="700" y="268">03</text>
    <text x="995" y="268">04</text>
    <text x="1290" y="268">05</text>
  </g>

  <g fill="#fffaf2" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="800">
    <text x="102" y="318">统一输入</text>
    <text x="397" y="318">AI 理解</text>
    <text x="692" y="318">选题研究</text>
    <text x="987" y="318">七页创作</text>
    <text x="1282" y="318">成图发布</text>
  </g>
  <g fill="#bfb0cf" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="20">
    <text x="102" y="359">灵感 · 公开网页</text>
    <text x="102" y="390">游戏截图</text>
    <text x="397" y="359">文字与结构识别</text>
    <text x="397" y="390">来源与事实边界</text>
    <text x="692" y="359">5 个候选选题</text>
    <text x="692" y="390">研究卡 · 3 个观点</text>
    <text x="987" y="359">逐页编辑 · AI 重写</text>
    <text x="987" y="390">锁定 · 历史版本</text>
    <text x="1282" y="359">PNG · 七页 ZIP</text>
    <text x="1282" y="390">标题 · 正文 · 标签</text>
  </g>

  <g fill="none" stroke="#d5a94d" stroke-width="4" marker-end="url(#arrow)">
    <path d="M326 317 H349"/>
    <path d="M621 317 H644"/>
    <path d="M916 317 H939"/>
    <path d="M1211 317 H1234"/>
  </g>

  <rect x="68" y="459" width="1464" height="60" rx="18" fill="#173c35" stroke="#3b987c" stroke-width="2"/>
  <circle cx="105" cy="489" r="15" fill="#4bc39b"/>
  <path d="M98 489 L103 494 L113 483" fill="none" stroke="#0e3028" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="137" y="498" fill="#d9fff1" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700">人工确认贯穿全流程：先核对事实，再选择观点；手工修改、锁定字段和历史版本不会被 AI 静默覆盖</text>
</svg>
